version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: medicalink_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword

  mongo-express:
    image: mongo-express
    container_name: medicalink_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=adminpassword
      - ME_CONFIG_MONGODB_URL=mongodb://admin:adminpassword@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongodb

  redis:
    image: redis:latest
    container_name: medicalink_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: medicalink_redis_insight
    ports:
      - "8001:8001"
    restart: unless-stopped
    volumes:
      - redis_insight_data:/db
    depends_on:
      - redis

volumes:
  mongodb_data:
  redis_data:
  redis_insight_data:
