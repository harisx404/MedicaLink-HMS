version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: medicalink_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Password123!
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: medicalink_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: medicalink_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://admin:Password123!@mongodb:27017/medicalink_main?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: prod_access_secret_must_be_32_chars_long_enough
      JWT_REFRESH_SECRET: prod_refresh_secret_must_be_32_chars_long_enough
      CLIENT_URL: http://localhost:80
    depends_on:
      - mongodb
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: medicalink_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mongodb_data:
  redis_data:
